name: Build CakBro Proktor (cross-platform)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CakBroProktor-windows.exe
          - os: ubuntu-22.04
            artifact: CakBroProktor-linux
          - os: macos-latest
            artifact: CakBroProktor-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm cakbro.spec
        shell: bash

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: move dist\CakBroProktor.exe dist\${{ matrix.artifact }}
        shell: cmd

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: mv dist/CakBroProktor "dist/${{ matrix.artifact }}"
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CakBroProktor-windows.exe/CakBroProktor-windows.exe
            dist/CakBroProktor-linux/CakBroProktor-linux
            dist/CakBroProktor-macos/CakBroProktor-macos
          generate_release_notes: true
